<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Belleza Celestial</title>
    <link rel="icon" href="logo2.png" type="image/png">
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #ffffff;
            --accent-color: #e3f2fd;
            --text-color: #333333;
            --card-bg: #ffffff;
            --success-color: #28a745;
            --warning-color: #ffc107;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--accent-color); color: var(--text-color); margin: 0; }
        
        header { background: var(--primary-color); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; }
        .logout-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .logout-btn:hover { background: rgba(255,255,255,0.3); }

        .container { max-width: 1200px; margin: 2rem auto; padding: 0 2rem; }
        
        .dashboard-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 2rem; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .card h3 { margin-bottom: 10px; color: #666; font-size: 1rem; }
        .card .number { font-size: 2.5rem; font-weight: bold; color: var(--primary-color); }

        .section-title { margin-bottom: 1rem; color: var(--primary-color); border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: var(--primary-color); color: white; }
        tr:hover { background: #f9f9f9; }

        .status-select { padding: 5px; border-radius: 5px; border: 1px solid #ddd; }
        .status-pendiente { color: var(--warning-color); font-weight: bold; }
        .status-enviado { color: var(--success-color); font-weight: bold; }
        .status-entregado { color: var(--primary-color); font-weight: bold; }

        .btn-action { padding: 5px 10px; border: none; border-radius: 3px; cursor: pointer; font-size: 0.9rem; margin-right: 5px; }
        .btn-delete { background: #ff4444; color: white; }
        
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary-color); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-box { background: white; padding: 2rem; border-radius: 10px; width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        .login-box button { width: 100%; padding: 10px; background: var(--primary-color); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        @media (max-width: 768px) {
            table { display: block; overflow-x: auto; }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Librería Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- Login de Admin -->
    <div class="login-overlay" id="admin-login">
        <div class="login-box">
            <h2 style="color: var(--primary-color); margin-bottom: 1rem;">Acceso Administrativo</h2>
            <input type="password" id="admin-pass" placeholder="Contraseña de Administrador">
            <button onclick="checkAdmin()">Ingresar</button>
            <p id="login-error" style="color: red; margin-top: 10px; display: none;">Contraseña incorrecta</p>
            <a href="index.html" style="display: block; margin-top: 15px; color: #666; text-decoration: none;">Volver a la Tienda</a>
        </div>
    </div>

    <div id="admin-panel" style="display: none;">
        <header>
            <div class="logo"><i class="fas fa-crown"></i> Panel Admin</div>
            <div>
                <span id="admin-date" style="margin-right: 15px; font-size: 0.9rem;"></span>
                <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
            </div>
        </header>

        <div class="container">
            <br>
            <div class="dashboard-cards">
                <div class="card">
                    <h3>Ventas Totales</h3>
                    <div class="number" id="total-sales">$0</div>
                </div>
                <div class="card">
                    <h3>Pedidos</h3>
                    <div class="number" id="total-orders">0</div>
                </div>
                <div class="card">
                    <h3>Usuarios</h3>
                    <div class="number" id="total-users">0</div>
                </div>
            </div>

            <!-- Contenedor del Gráfico -->
            <div class="card" style="margin-bottom: 2rem; text-align: left;">
                <h3 style="color: var(--primary-color); margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">Tendencia de Ventas</h3>
                <canvas id="salesChart" style="width: 100%; max-height: 400px;"></canvas>
            </div>

            <h2 class="section-title">Gestión de Pedidos</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Cliente (Email)</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="orders-table">
                    <!-- Pedidos cargados dinámicamente -->
                </tbody>
            </table>

            <br><br>
            <h2 class="section-title">Usuarios Registrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Puntos</th>
                    </tr>
                </thead>
                <tbody id="users-table">
                    <!-- Usuarios cargados dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Simulación de seguridad básica
        function checkAdmin() {
            const pass = document.getElementById('admin-pass').value;
            // Contraseña hardcodeada para el ejemplo: "admin123"
            if(pass === 'admin123') {
                document.getElementById('admin-login').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                sessionStorage.setItem('belleza_admin_logged', 'true');
                loadData();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('belleza_admin_logged');
            location.reload();
        }

        // Verificar sesión al cargar
        if(sessionStorage.getItem('belleza_admin_logged') === 'true') {
            document.getElementById('admin-login').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            loadData();
        }

        function loadData() {
            const orders = JSON.parse(localStorage.getItem('belleza_orders')) || [];
            const users = JSON.parse(localStorage.getItem('belleza_users')) || [];

            // Estadísticas
            document.getElementById('total-orders').textContent = orders.length;
            document.getElementById('total-users').textContent = users.length;
            
            const totalSales = orders.reduce((sum, order) => {
                const amount = parseFloat(order.total.replace('$', ''));
                return sum + (isNaN(amount) ? 0 : amount);
            }, 0);
            document.getElementById('total-sales').textContent = '$' + totalSales.toFixed(2);

            // Tabla de Pedidos
            const ordersTable = document.getElementById('orders-table');
            ordersTable.innerHTML = orders.map((order, index) => `
                <tr>
                    <td>#${order.id}</td>
                    <td>${order.date}</td>
                    <td>${order.userEmail}</td>
                    <td>${order.total}</td>
                    <td>
                        <select class="status-select" onchange="updateStatus(${index}, this.value)">
                            <option value="Pendiente" ${order.status === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                            <option value="Enviado" ${order.status === 'Enviado' ? 'selected' : ''}>Enviado</option>
                            <option value="Entregado" ${order.status === 'Entregado' ? 'selected' : ''}>Entregado</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn-action btn-delete" onclick="deleteOrder(${index})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');

            // Tabla de Usuarios
            const usersTable = document.getElementById('users-table');
            usersTable.innerHTML = users.map(user => `
                <tr>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${user.points || 0}</td>
                </tr>
            `).join('');

            document.getElementById('admin-date').textContent = new Date().toLocaleDateString();
            
            // Renderizar el gráfico con los datos cargados
            renderChart(orders);
        }

        function updateStatus(index, newStatus) {
            let orders = JSON.parse(localStorage.getItem('belleza_orders')) || [];
            if(orders[index]) {
                orders[index].status = newStatus;
                localStorage.setItem('belleza_orders', JSON.stringify(orders));
                // Feedback visual opcional
            }
        }

        function deleteOrder(index) {
            if(confirm('¿Estás seguro de eliminar este pedido?')) {
                let orders = JSON.parse(localStorage.getItem('belleza_orders')) || [];
                orders.splice(index, 1);
                localStorage.setItem('belleza_orders', JSON.stringify(orders));
                loadData();
            }
        }

        // Variable global para la instancia del gráfico
        let salesChartInstance = null;

        function renderChart(orders) {
            const ctx = document.getElementById('salesChart').getContext('2d');
            
            // 1. Agrupar ventas por fecha
            const salesByDate = {};
            orders.forEach(order => {
                const date = order.date;
                // Limpiar el string de precio (quitar '$' y posibles comas) para convertir a número
                const amount = parseFloat(order.total.replace('$', '').replace(',', ''));
                
                if (!isNaN(amount)) {
                    salesByDate[date] = (salesByDate[date] || 0) + amount;
                }
            });

            const labels = Object.keys(salesByDate);
            const data = Object.values(salesByDate);

            // 2. Destruir gráfico anterior si existe (para evitar superposiciones al recargar)
            if (salesChartInstance) {
                salesChartInstance.destroy();
            }

            // 3. Crear nuevo gráfico
            salesChartInstance = new Chart(ctx, {
                type: 'bar', // Puedes cambiar a 'line' si prefieres líneas
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Ventas por Día ($)',
                        data: data,
                        backgroundColor: 'rgba(0, 86, 179, 0.6)', // Color primario con transparencia
                        borderColor: 'rgba(0, 86, 179, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) { return '$' + value; } // Formato moneda en eje Y
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
